<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<!-- De publieke Vue-weergave opent bewust iets uitgezoomd, zodat lange
     dubbelnamen en beide wedstrijdkolommen direct binnen het telefoonscherm vallen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=3, user-scalable=yes">
<title>Pooltoernooi Vue</title>
<meta name="theme-color" content="#17613f">
<link rel="manifest" href="./beheer.webmanifest" id="pool-manifest">
<link rel="icon" type="image/png" sizes="192x192" href="./beheer-icon-192.png" id="pool-icon">
<link rel="apple-touch-icon" href="./beheer-icon-192.png" id="pool-apple-icon">

<style>
:root {
  --bg: #eef1ec; --surface: #ffffff; --surface2: #f4f6f2; --ink: #16241c; --muted: #5d6e63; --line: #d3dcd5;
  --brand: #17613f; --brand-ink: #ffffff; --brand-soft: #dcebe2; --accent: #2f7fb5; --accent-soft: #dcecf6;
  --good: #1f8a4c; --good-soft: #dff1e5; --bad: #b8382f; --bad-soft: #f7dedb; --warn: #a96a0c; --warn-soft: #f8ebd0;
  --hero: linear-gradient(180deg, #1b7048, #135437); --hero-ink: #f4f1e4; --rail: linear-gradient(180deg, #8a5a2b, #5d3a17);
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.08);
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display-weight: 700; --display-tracking: 0; --display-case: none;
  color-scheme: light;
}
:root[data-mode="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); text-transform: var(--display-case); line-height: 1.2; }
h2 { font-size: 1.45rem; } h3 { font-size: 1.12rem; } h4 { font-size: 1rem; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .tiny { font-size: .78rem; }
.right { text-align: right; } .center { text-align: center; } .nowrap { white-space: nowrap; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; } .gap-s { gap: 6px; } .gap-l { gap: 18px; }
.stack > * + * { margin-top: 12px; } .stack-l > * + * { margin-top: 22px; }

/* ---------- Hero (de tafel) ---------- */
.hero { background: var(--hero); color: var(--hero-ink); position: relative; }
.hero-in { max-width: 1240px; margin: 0 auto; padding: 16px 20px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.hero .logo { height: 58px; max-width: 160px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,.1); padding: 4px; }
.hero .logo-bal { font-size: 2.3rem; line-height: 1; }
.hero h1 { font-size: clamp(1.4rem, 2.6vw, 2.15rem); }
.hero .sub { opacity: .85; font-size: .95rem; margin-top: 2px; }
.hero .meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hero-public { width: calc(100% - 40px); margin: 0 auto; border-radius: 0 0 var(--radius) var(--radius); }
.hero-public { overflow: hidden; }
/* Poolbreak: compact naast logo; opbouw in driehoek, snelle break, elke 30 s. */
.hero-public .hero-in{position:relative;isolation:isolate;min-height:64px}
.hero-public .hero-in > :not(.viewer-break){position:relative;z-index:2}
.hero-public .viewer-break{position:absolute;z-index:1;left:415px;top:1px;width:160px;height:70px;pointer-events:none;overflow:visible;transform-origin:top left}
.viewer-break .rack-ball{position:absolute;width:12px;height:12px;border-radius:50%;left:91px;top:32px;background:radial-gradient(circle at 30% 25%,#fff9 0%,#fff5 12%,transparent 38%),var(--bc);box-shadow:inset -2px -2px 3px #0008,0 1px 3px #0008;transform:translate(var(--sx),var(--sy));animation:rack-fill-scatter 30s linear infinite, var(--appear) 30s linear infinite}
.viewer-break .rack-ball::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff8}
.viewer-break .rack-triangle{position:absolute;left:85px;top:-5px;width:65px;height:74px;overflow:visible;animation:rack-frame 30s linear infinite}
.viewer-break .rack-triangle path{fill:none;stroke:#d8b47b;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #0009)}
.viewer-break .cue-ball{position:absolute;width:13px;height:13px;border-radius:50%;top:32px;left:-26px;background:radial-gradient(circle at 28% 25%,#fff,#cdd3db 80%);box-shadow:0 1px 4px #0008;opacity:0;animation:cue-strike 30s linear infinite}
@keyframes rack-frame{0%,49%{opacity:1}52%,100%{opacity:0}}
@keyframes cue-strike{0%,55%{transform:translateX(-55px);opacity:0}56%{opacity:1}58.7%{transform:translateX(110px);opacity:1}60%{transform:translateX(140px);opacity:0}63.1%,100%{opacity:0}}
@keyframes rack-fill-scatter{0%,58.6%{transform:translate(var(--sx),var(--sy))}58.7%{transform:translate(var(--sx),var(--sy));opacity:1}75%{transform:translate(calc(var(--sx) + var(--dx)),calc(var(--sy) + var(--dy)));opacity:0}100%{transform:translate(calc(var(--sx) + var(--dx)),calc(var(--sy) + var(--dy)));opacity:0}}
@keyframes rack-appear-0{0%,10.0%{opacity:0}10.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-1{0%,12.5%{opacity:0}12.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-2{0%,15.0%{opacity:0}15.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-3{0%,17.5%{opacity:0}17.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-4{0%,20.0%{opacity:0}20.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-5{0%,22.5%{opacity:0}22.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-6{0%,25.0%{opacity:0}25.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-7{0%,27.5%{opacity:0}27.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-8{0%,30.0%{opacity:0}30.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-9{0%,32.5%{opacity:0}32.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-10{0%,35.0%{opacity:0}35.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-11{0%,37.5%{opacity:0}37.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-12{0%,40.0%{opacity:0}40.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-13{0%,42.5%{opacity:0}42.65%,58.7%{opacity:1}75%,100%{opacity:0}}
@keyframes rack-appear-14{0%,45.0%{opacity:0}45.15%,58.7%{opacity:1}75%,100%{opacity:0}}
@media(max-width:980px){.hero-public .hero-in{min-height:72px;padding-bottom:10px!important}.hero-public .viewer-break{left:96px;top:29px;transform:scale(.65)}.hero-public .viewer-countdown{z-index:3}}
@media(prefers-reduced-motion:reduce){.viewer-break *{animation:none!important}.viewer-break .rack-ball{opacity:1!important}.viewer-break .cue-ball{opacity:0!important}.viewer-break .rack-triangle{opacity:0!important}}
.hero-public .hero-in { padding: 8px 12px 10px; gap: 10px; }
.hero-public .logo { height: 42px; max-width: 110px; }
.hero-public h1 { font-size: 1.2rem; }
.hero-public .sub { font-size: .82rem; }
.hero-title-row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.hero-tournament { font-family: var(--font-display); font-size: clamp(1.15rem, 2.3vw, 1.8rem); font-weight: 700; line-height: 1.2; }
.hero-public .hero-title-row { gap: 10px; }
.hero-public .hero-tournament { font-size: 1.05rem; }
@media (max-width: 980px) {
  .hero-public .hero-in { flex-wrap: nowrap; }
  .hero-public .hero-in > div:not(.meta) { min-width: 0; flex: 1 1 auto; }
  .hero-public .hero-title-row { flex-wrap: nowrap; gap: 6px; min-width: 0; }
  .hero-public .hero-title-row h1,
  .hero-public .hero-tournament { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-public h1 { font-size: 1rem; }
  .hero-public .hero-tournament { font-size: .9rem; }
  .hero-public .logo-bal { flex: 0 0 34px; width: 34px; font-size: 1.8rem; }
}
.rail { height: 8px; background: var(--rail); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }

/* ---------- Navigatie ---------- */
.nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.nav-in { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
.nav button { background: none; border: 0; padding: 13px 14px 11px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand); }
.nav .badge { display: inline-block; min-width: 1.4em; padding: 0 .4em; margin-left: 6px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: .75rem; text-align: center; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }

/* ---------- Knoppen en invoer ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); border-radius: calc(var(--radius) - 2px); padding: 8px 14px; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sec:hover { border-color: var(--brand); filter: none; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: .86rem; }
.btn.lg { padding: 12px 20px; font-size: 1.05rem; }
.btn[disabled], .btn.off { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.act { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 4px var(--accent); }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) - 3px); padding: 7px 9px; min-width: 0; }
input[type=text]:hover, input[type=date]:hover, select:hover, textarea:hover { border-color: var(--muted); }
input.bad { border-color: var(--bad); background: var(--bad-soft); color: #5a1610; }
textarea { width: 100%; min-height: 160px; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; }
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .88rem; }
label.f > span.hint { font-weight: 400; color: var(--muted); }
input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--brand); }
input[type=color] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

/* ---------- Blokken ---------- */
.sect { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.sect > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sect > header h3 { margin-right: auto; }
.sect .body { padding: 14px 16px; }
.note { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 9px 12px; border-radius: 0 var(--radius) var(--radius) 0; color: var(--ink); }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); }
.note.good { border-color: var(--good); background: var(--good-soft); }
:root[data-mode="dark"] .note, :root[data-mode="dark"] .note.warn, :root[data-mode="dark"] .note.bad, :root[data-mode="dark"] .note.good { color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .grid2, .grid3, .cols { grid-template-columns: 1fr; } }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.solid { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
:root[data-mode="dark"] .chip.ok { color: #7fe0a4; } :root[data-mode="dark"] .chip.bad { color: #ff9d94; }
:root[data-mode="dark"] .chip.warn { color: #f4c36a; } :root[data-mode="dark"] .chip.info { color: #8cc8f0; }
.hero .chip { background: var(--hero-chip, rgba(255,255,255,.14)); color: var(--hero-ink); border-color: var(--hero-chip-line, rgba(255,255,255,.2)); }
.hero .chip.warn { background: #f8ebd0; color: #7b4b00; } .hero .chip.ok { background: #dff1e5; color: #14653a; }

/* ---------- Pool-ballen ---------- */
.ball { --c: #888; position: relative; display: inline-grid; place-items: center; width: 1.55em; height: 1.55em; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 38%), var(--c); box-shadow: inset -2px -3px 5px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25); font-size: .86rem; }
.ball::before { content: ""; position: absolute; width: 62%; height: 62%; border-radius: 50%; background: #fbfbf6; }
.ball b { position: relative; color: #111; font-size: .72em; font-weight: 800; line-height: 1; }
.ball.b1 { --c: #f2bf00; } .ball.b2 { --c: #1c4fa6; } .ball.b3 { --c: #d0312d; } .ball.b4 { --c: #5b2a86; }
.ball.b5 { --c: #ef7a16; } .ball.b6 { --c: #1b7a3f; } .ball.b7 { --c: #7a2a22; } .ball.b8 { --c: #151515; }
.ball.ph { --c: #8a9a90; }
.ball.big { font-size: 1.15rem; }

/* ---------- Tabellen ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: .8rem; font-weight: 700; color: var(--muted); padding: 7px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: var(--surface2); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
table.t input[type=text] { width: 100%; }
table.t select { max-width: 150px; }

/* ---------- Stand ---------- */
.stand td, .stand th { padding: 7px 8px; }
.stand .naam { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.stand tr.door td { background: var(--good-soft); }
.stand tr.uit td { background: var(--bad-soft); color: var(--muted); }
.stand tr.po td { background: var(--warn-soft); }
.stand tr td:first-child { font-weight: 800; font-variant-numeric: tabular-nums; }
:root[data-mode="dark"] .stand tr.door td, :root[data-mode="dark"] .stand tr.uit td, :root[data-mode="dark"] .stand tr.po td { color: var(--ink); }
.stand .eq { color: var(--warn); font-weight: 800; margin-left: 2px; }

/* ---------- Scorekaart ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.card > .ch { padding: 9px 14px; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card > .ch h4 { margin-right: auto; }
.card > .ch .chip { background: rgba(255,255,255,.18); color: inherit; border-color: transparent; }
.card .rows > div { display: flex; align-items: center; gap: 9px; padding: 7px 14px; border-bottom: 1px solid var(--line); min-height: 40px; }
.card .rows > div:last-child { border-bottom: 0; }
.card .rows .nm { font-weight: 600; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .rows .sym { font-weight: 800; width: 1.4em; text-align: center; }
.card .rows .sym.ok { color: var(--good); } .card .rows .sym.no { color: var(--bad); } .card .rows .sym.po { color: var(--warn); }
.card .rows .pick { cursor: pointer; }
.card .rows .pick:hover { background: var(--surface2); }
.card .rows .sel { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
.card .rows .pending .nm { opacity: .25; }
.card .rows .reveal .nm { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.9); color: var(--accent); } 60% { transform: scale(1.04); } 100% { transform: none; } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }

/* ---------- Wedstrijdregels ---------- */
.games { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.game { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 2rem minmax(0, 1fr); align-items: stretch; border-bottom: 1px solid var(--line); background: var(--surface); }
.game:last-child { border-bottom: 0; }
.game .gnr { display: grid; place-items: center; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); background: var(--surface2); }
.game .vs { display: grid; place-items: center; color: var(--muted); font-size: .8rem; }
.game .pl { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 11px 12px; cursor: pointer; text-align: left; min-width: 0; font-weight: 600; font-size: 1rem; }
.game .pl .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.game .pl .sc { font-weight: 800; font-size: 1.15rem; min-width: 1.2em; text-align: center; }
.game .pl .brk { font-size: .68rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; }
.game .pl:hover { background: var(--surface2); }
.game .pl.win { background: var(--good-soft); color: var(--good); }
.game .pl.win .sc { color: var(--good); }
.game .pl.loss { color: var(--ink); }
.game .pl.loss .nm { text-decoration: none; }
.game.viewer-game .pl,
.game.viewer-game .pl.loss,
.game.viewer-game .pl.win { color: var(--ink); background: transparent; }
.game.viewer-game .pl.loss .nm { text-decoration: none; }
.game.viewer-game .pl.win .sc { color: var(--good); }
.game .ball, .playoff-block .games .ball, .playoff-block .games + .row .ball { display: none !important; }
.game.viewer-game { grid-template-columns: minmax(0, 1fr) 2rem minmax(0, 1fr); }
.ghead.viewer-ghead { grid-template-columns: minmax(0, 1fr) 2rem minmax(0, 1fr); }
@media (max-width: 980px) {
  .game.viewer-game .pl .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; line-height: 1.15; }
}
.public-match-list,
.public-match-card,
.public-match-card .body,
.public-match-card .games { width: 100%; min-width: 0; max-width: none; }
.game.actief { box-shadow: inset 5px 0 0 var(--accent); background: var(--accent-soft); }
.game.actief .gnr { background: var(--accent); color: #fff; }
.game.skip { opacity: .4; }
:root[data-mode="dark"] .game .pl.win { color: #8ff0b2; }
.pauze { text-align: center; padding: 6px; background: var(--brand); color: var(--brand-ink); font-weight: 700; letter-spacing: .08em; font-size: .85rem; }

/* ---------- Overzicht ---------- */
.next { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 18px 20px; }
.next .dt { text-align: center; padding: 6px 16px; border-right: 2px solid var(--line); }
.next .dt .d { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-weight: 800; color: var(--brand); }
:root[data-mode="dark"] .next .dt .d { color: var(--accent); }
.next .dt .m { font-size: .9rem; color: var(--muted); }
.funnel { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.funnel .st { flex: 1 1 150px; padding: 14px 16px; border-right: 1px solid var(--line); position: relative; cursor: pointer; background: transparent; border-top: 0; border-bottom: 0; border-left: 0; text-align: left; }
.funnel .st:last-child { border-right: 0; }
.funnel .st:hover { background: var(--surface2); }
.funnel .st .n { font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; line-height: 1; }

  #main:has(.loting-pref-list) .sect > header h3 { min-width:0; overflow-wrap:anywhere; white-space:normal; }
  #main:has(.loting-pref-list) .note { overflow-wrap:anywhere; white-space:normal; }
  .loting-pref-list { width:100%; max-width:100%; overflow-x:hidden!important; overflow-y:auto!important; }
  .loting-pref-list table.t, .loting-pref-list tbody { display:block; width:100%; min-width:0; }

  .loting-pref-list table.t tr { display:grid; grid-template-columns:32px minmax(0,1fr); gap:5px 10px; padding:11px 3px; border-bottom:1px solid var(--line); }
  .loting-pref-list table.t td { display:block; min-width:0; padding:3px 0; border:0; overflow-wrap:anywhere; }
  .loting-pref-list table.t td:first-child { grid-column:1; grid-row:1; text-align:left; padding-top:5px; }
  .loting-pref-list table.t td:nth-child(2) { grid-column:2; grid-row:1; font-weight:650; line-height:1.35; }
  .loting-pref-list table.t td:nth-child(2) .chip { display:table; margin-top:6px; white-space:normal; }
  .loting-pref-list table.t td:nth-child(3) { grid-column:2; grid-row:2; }
  .loting-pref-list table.t td:nth-child(4) { grid-column:2; grid-row:3; }
  .loting-pref-list table.t td:nth-child(3):not([colspan])::before { content:'Voorkeur dag'; display:block; font-size:.75rem; color:var(--muted); margin-bottom:4px; }

  .loting-pref-list table.t td[colspan] { grid-column:2; grid-row:2; color:var(--muted); }
}

   Geen DOM-afhankelijkheid: werkt in de browser én in Node (voor tests).

(function (root) {

/* ---------- Willekeur ---------- */
let rng = Math.random;
function setRng(f) { rng = f; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.floor(rng() * 1e6).toString(36) + (idTeller++).toString(36); }

/* ---------- Datums (ISO-strings, lokale tijd) ---------- */
const DAGEN = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
const MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
function isoNaarDatum(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function datumNaarIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function plusDagen(iso, n) { const d = isoNaarDatum(iso); d.setDate(d.getDate() + n); return datumNaarIso(d); }
function dagNaam(iso) { return DAGEN[isoNaarDatum(iso).getDay()]; }
function hoofd(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function datumLang(iso) { const d = isoNaarDatum(iso); return hoofd(DAGEN[d.getDay()]) + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()] + ' ' + d.getFullYear(); }
function datumKort(iso) { const d = isoNaarDatum(iso); return DAGEN[d.getDay()].slice(0, 2) + ' ' + d.getDate() + '-' + (d.getMonth() + 1); }
function vandaagIso() { return datumNaarIso(new Date()); }

/* ---------- Toernooiformat (de trechter) ---------- */
function pouleGroottes(M) {
  if (M <= 0) return [];
  if (M <= 6) return [M];
  const P = Math.ceil(M / 5), basis = Math.floor(M / P), rest = M % P, s = [];
  for (let i = 0; i < P; i++) s.push(basis + (i < rest ? 1 : 0));

}
const PEN = { 1: 8, 2: 6, 3: 3, 4: 1, 5: 0, 6: 1 };
function straf(sizes) { return sizes.reduce((t, x) => t + (PEN[x] !== undefined ? PEN[x] : Math.abs(x - 5) * 3), 0); }

/* opt.derden = { <index>: 'auto' | 'ja' | 'nee' } */
function bouwFormat(N, opt) {
  opt = opt || {};
  const rondes = [];
  let M = N, idx = 0;
  while (M > 0 && idx < 12) {
    const sizes = pouleGroottes(M), P = sizes.length;
    if (P === 1) { rondes.push({ M, sizes, derden: 0, next: 0 }); break; }

    const kanDerde = Math.floor(P / 2);
    const A = 2 * P, B = 2 * P + kanDerde;

    else if (ovr === 'nee') metDerde = false;
    else metDerde = straf(pouleGroottes(B)) < straf(pouleGroottes(A));

function bouwKalender(startIso, rondes, opt, vanIndex, startWeekend) {

const THEMA_STANDAARD = 'biljartgroen';

      gepubliceerd: false

    locaties: [{ id: locId, naam: o.locatieNaam || 'Hoofdlocatie', thema: THEMA_STANDAARD, kleuren: {}, font: '', logo: '', adres: '', slogan: '' }],
    locatieId: locId,
    spelers: [],

    rondes: {},
    ph: {},              // plaatshouders voor spelers die nog in een play-off zitten

/* ---------- Loting ---------- */

    if (!g.w || !rij[g.a] || !rij[g.b]) return;
    rij[g.a].gespeeld++; rij[g.b].gespeeld++;
    if (rij[g.w]) rij[g.w].punten++;

  rows.forEach(r => { r.rest = tot - r.gespeeld; r.max = r.punten + r.rest; r.totaal = tot; });

  while (a > 0 && rows[a - 1].punten === pk) a--;

/* Wedstrijdblok zoals de eerste helft van een speeldag: de speler links (a) breekt.

function onlineActief() {

function stopOnlineSynchronisatie() {
  if (onlineUnsub) { onlineUnsub(); onlineUnsub = null; }

}

function startOnlineSynchronisatie() {
  const o = window.POOL_ONLINE;
  if (!o || !o.state || !o.state.user || !T || !T.id || UI.viewer) return;
  if (onlineUnsub) return;
  const subscribedId = T.id;
  onlineUnsub = o.subscribeTournament(subscribedId, remote => {
    if (onlineApplying || UI.viewer || !remote || !T || remote.id !== T.id ||
        subscribedId !== T.id || !T.online || !T.online.synchroniseren) return;
    const remoteTime = Date.parse(remote.gewijzigd || '') || 0;
    const localTime = Date.parse(T.gewijzigd || '') || 0;
    // Never discard local edits that are still waiting to be uploaded.
    if (onlineSaveTimer) return;
    // Equal timestamps can occur with imported snapshots. Avoid a pointless rerender.
    if (remoteTime < localTime) return;
    if (remoteTime === localTime && JSON.stringify(remote.rondes) === JSON.stringify(T.rondes) &&
        JSON.stringify(remote.derden) === JSON.stringify(T.derden)) return;
    onlineApplying = true;
    try {
      const tab = UI.tab, dag = UI.dag && { key: UI.dag.key, nr: UI.dag.nr };
      const dagLijst = UI.dagLijst, stand = UI.stand, lotingKey = UI.lotingKey;

      UI.dagLijst = dagLijst;
      UI.stand = stand && P.planRonde(T, stand) ? stand : null;
      UI.lotingKey = lotingKey && P.planRonde(T, lotingKey) ? lotingKey : null;

/* ---------- toasts en dialogen ---------- */
function toast(tekst, slecht) {
  let c = $('#toasts'); if (!c) { c = document.createElement('div'); c.id = 'toasts'; c.className = 'toasts'; c.setAttribute('role', 'status'); document.body.appendChild(c); }
  const t = document.createElement('div'); t.className = 'toast' + (slecht ? ' bad' : ''); t.textContent = tekst; c.appendChild(t);
  setTimeout(() => t.remove(), slecht ? 5200 : 3200);
}
function dialoog(o) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    const knoppen = (o.knoppen || [{ label: o.ok || 'OK', val: true, cls: o.gevaar ? 'danger' : '' }]);
    ov.innerHTML = '<div class="dialog' + (o.breed ? ' wide' : '') + '"><h3>' + esc(o.titel || '') + '</h3><div class="db">' + (o.html || '') + '</div><div class="df"></div></div>';
    const df = $('.df', ov);
    function sluit(v) { ov.remove(); document.removeEventListener('keydown', toets, true); resolve(v); }
    function toets(e) { if (e.key === 'Escape') { e.stopPropagation(); sluit(o.annuleer === false ? true : null); } }
    document.addEventListener('keydown', toets, true);
    if (o.annuleer !== false && !o.knoppen) { const b = document.createElement('button'); b.className = 'btn sec'; b.textContent = o.nee || 'Annuleer'; b.onclick = () => sluit(null); df.appendChild(b); }
    knoppen.forEach(k => {
      const b = document.createElement('button'); b.className = 'btn ' + (k.cls || ''); b.textContent = k.label; b.dataset.val = String(k.val);
      b.onclick = () => {
        if (k.val === null || k.val === false) return sluit(null);
        if (o.lees) { const w = o.lees(ov, k.val); if (w === false) return; sluit(w); } else sluit(k.val);
      };
      df.appendChild(b);
    });
    document.body.appendChild(ov);
    const eerste = $('[autofocus]', ov) || $('input,select,textarea', ov) || $('.df .btn:last-child', ov); if (eerste) eerste.focus();
    if (o.klaar) o.klaar(ov);
  });
}
function bevestig(tekst, o) {
  o = o || {};
  return dialoog({ titel: o.titel || 'Weet je het zeker?', html: '<p>' + tekst + '</p>', ok: o.ja || 'Doorgaan', nee: o.nee || 'Annuleer', gevaar: o.gevaar }).then(v => !!v);
}
function melding(titel, html) { return dialoog({ titel, html, ok: 'OK', annuleer: false }); }

/* ---------- status per speeldag ---------- */
function dagStatus(key, nr) {
  if (!P.rondeGeloot(T, key)) return { code: 'gepland', cls: '', tekst: 'Nog niet geloot', kort: 'Gepland' };
  const p = P.zoekPoule(T, key, nr);
  if (!p) return { code: 'gepland', cls: '', tekst: 'Gepland', kort: 'Gepland' };
  if (p.spelers.some(P.isPh)) return { code: 'wacht', cls: 'warn', tekst: 'Wacht op play-off', kort: 'Wacht' };
  const gespeeld = p.schema.filter(g => g.w).length;
  if (P.pouleAfgerond(T, p)) return { code: 'klaar', cls: 'ok', tekst: 'Gespeeld', kort: 'Gespeeld' };
  if (P.reguliereKlaar(p) && p.pp && !p.pp.voltooid) return { code: 'playoff', cls: 'warn', tekst: 'Play-off nodig', kort: 'Play-off' };
  if (gespeeld === 0) return { code: 'open', cls: 'info', tekst: 'Klaar om te spelen', kort: 'Open' };
  return { code: 'bezig', cls: 'info', tekst: 'Bezig · ' + gespeeld + '/' + p.schema.length, kort: gespeeld + '/' + p.schema.length };
}
function alleDagen() { return T.plan.dagen.slice().sort((a, b) => a.datum.localeCompare(b.datum) || a.poule - b.poule); }
function volgendeSpeeldag() {
  for (const d of alleDagen()) {
    if (!P.rondeGeloot(T, d.ronde)) continue;
    const s = dagStatus(d.ronde, d.poule), vk = P.volgendeKey(T, d.ronde);
    if (s.code === 'klaar') continue;
    if (s.code === 'playoff' && vk && P.rondeGeloot(T, vk)) continue; // wordt gespeeld op de dag van de volgende ronde
    return d;
  }
  return null;
}
/* Openstaande play-offs die bij een volgende speeldag horen. */
function playoffsVoorDag(d) {
  if (!d || !P.rondeGeloot(T, d.ronde)) return [];
  const p = P.zoekPoule(T, d.ronde, d.poule);
  if (!p) return [];
  const src = bronnenPh(d.ronde, p), result = [];
  if (!src.vk) return result;
  Object.keys(src.pool).forEach(n => {
    const q = P.zoekPoule(T, src.vk, Number(n));
    if (q && q.pp && !q.pp.voltooid) result.push({key:src.vk,nr:Number(n), label:'Play-off '+rondePoule(src.vk,Number(n)), namen:q.pp.stappen[q.pp.stappen.length-1].groep.map(spelerNaam).join(' / ')});
  });
  Object.keys(src.derde).forEach(i => {
    const st = P.derdeStatus(T,src.vk,Number(i));
    if (st.status === 'playoff') result.push({key:src.vk,i:Number(i),label:'Play-off beste nummer 3',namen:[st.a,st.b].map(spelerNaam).join(' / ')});
  });
  return result;
}

function publiekeActueleSpeeldag() {

/* Een speeldag mag pas worden bijgewerkt als alle eerdere speeldagen zijn afgerond. Een play-off die op de dag van de
   volgende ronde wordt gespeeld, blokkeert niet. */
function blokkerendeDag(key, nr) {
  if (T.instellingen.strikteVolgorde === false) return null;
  const alle = alleDagen(), ix = alle.findIndex(d => d.ronde === key && d.poule === nr);
  for (let i = 0; i < ix; i++) {

    const s = dagStatus(d.ronde, d.poule);
    if (s.code === 'klaar') continue;
    if (s.code === 'playoff') { const vk = P.volgendeKey(T, d.ronde); if (vk && P.rondeGeloot(T, vk)) continue; }
    return d;
  }
  return null;
}

/* Aftellen naar de eerstvolgende niet-afgeronde gelote speeldag.
   Een nog openstaande speeldag houdt de klok vast, ook na zijn startdatum.
   De klok gebruikt expliciet Europe/Amsterdam, onafhankelijk van de telefoonzone. */
function countdownTarget(){
  if(!UI.viewer || !T || !T.plan || !T.plan.dagen)return null;
  const dagen=alleDagen().filter(d=>P.rondeGeloot(T,d.ronde));
  const d=dagen.find(d=>dagStatus(d.ronde,d.poule).code!=='klaar');
  if(!d)return null;
  const playoff=dagStatus(d.ronde,d.poule).code==='playoff';
  const hh=playoff?13:14;
  const iso=d.datum+'T'+String(hh).padStart(2,'0')+':00:00';
  // Tijdzone Nederland: offset via Intl, ook correct rond zomer-/wintertijd.
  const utc=Date.parse(iso+'Z');
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',timeZoneName:'shortOffset'}).formatToParts(new Date(utc));
  const zone=(parts.find(x=>x.type==='timeZoneName')||{}).value||'GMT+1';
  const m=zone.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
  const offset=m?(m[1]==='+'?1:-1)*(Number(m[2])*60+Number(m[3]||0)):60;
  return {d,playoff,hh,ms:utc-offset*60000};
}
function countdownHtml(){
  if(!UI.viewer)return '';
  const t=countdownTarget();
  if(!t || UI.tab!=='dag' || !UI.dag || UI.dag.key!==t.d.ronde || UI.dag.nr!==t.d.poule)return '';
  return '<div class="viewer-countdown noprint" id="viewerCountdown" role="timer" aria-label="Aftellen naar de eerstvolgende speeldag"><span class="cd-label">⏱ START OVER</span><span class="cd-value" id="viewerCountdownValue">--</span><span class="cd-date">'+esc(P.datumKort(t.d.datum))+' · '+t.hh+':00</span></div>';
}
function updateViewerCountdown(){
  const el=document.getElementById('viewerCountdownValue');if(!el)return;
  const t=countdownTarget();if(!t || UI.tab!=='dag' || !UI.dag || UI.dag.key!==t.d.ronde || UI.dag.nr!==t.d.poule){el.closest('.viewer-countdown')?.remove();return;}
  let sec=Math.max(0,Math.ceil((t.ms-Date.now())/1000));
  if(sec===0){el.closest('.viewer-countdown')?.classList.add('is-live');el.textContent='● LIVE';return;}
   el.closest('.viewer-countdown')?.classList.remove('is-live');
  const d=Math.floor(sec/86400);sec%=86400;
  const h=Math.floor(sec/3600);sec%=3600;
  const m=Math.floor(sec/60),ss=sec%60;
  const pad=n=>String(n).padStart(2,'0');
  el.textContent=(d?d+'d ':'')+pad(h)+':'+pad(m)+':'+pad(ss);
}

function volgendeStap() {
  if (P.actief(T).length < 4) return { soort: 'spelers' };
  for (const r of T.plan.rondes) {
    if (!P.rondeGeloot(T, r.key)) return { soort: 'loot', key: r.key };
    if (!P.reguliereKlaarRonde(T, r.key)) return { soort: 'speel', key: r.key };
  }
  for (const r of T.plan.rondes) if (!P.rondeAfgerond(T, r.key)) return { soort: 'speel', key: r.key };

/* ---------- stand ---------- */
/* Vanaf hoeveel maximaal haalbare punten iemand nog kans heeft om door te gaan. In rondes met beste nummer 3
   telt ook die route mee: zolang je de nummer 3 van de poule (en van de andere poule van het weekend) nog kunt halen, ben je in de race. */
function geenKansDrempel(key, p, rows, r) {
  const p2 = rows[1] ? rows[1].punten : 0, pr = P.planRonde(T, key);
  if (!pr || !pr.derden || rows.length < 3) return p2;
  const rd = T.rondes[key], ix = rd.poules.indexOf(p);
  if (ix < 0 || Math.floor(ix / 2) >= Math.floor(rd.poules.length / 2)) return p2;
  let t3 = rows[2].punten;
  const partner = rd.poules[ix % 2 === 0 ? ix + 1 : ix - 1];
  if (partner && P.reguliereKlaar(partner)) {
    const rp = P.standPoule(T, partner)[2];
    if (rp) t3 = Math.max(t3, rp.punten / Math.max(1, rp.totaal) * r.totaal - 1e-9);

  return Math.min(p2, t3);
}
function rijStatus(key, p, rows, r, idx) {

    if (klaarReg && p.pp && !p.pp.voltooid && p.pp.stappen[0].groep.indexOf(r.id) >= 0) return { cls: 'po', chip: '<span class="chip warn">Play-off ' + plaatsTekst(p.pp.start, p.pp.eind) + '</span>' };
    return { cls: '', chip: '' };
  }
  if (!klaarReg) {
    if (!r.gespeeld) return { cls: '', chip: '' };
    if (r.max < geenKansDrempel(key, p, rows, r)) return { cls: 'uit', chip: '<span class="chip bad">Geen kans</span>' };
    if (idx < 2) return { cls: 'door', chip: '<span class="chip ok">Op koers</span>' };
    return { cls: '', chip: '<span class="chip">In de race</span>' };
  }
  const pp = p.pp;

    if (idx + 1 < pp.start) return { cls: 'door', chip: '<span class="chip ok">Door</span>' };
    if (idx === 2 && pr.derden) return { cls: '', chip: '<span class="chip info">Nr. 3</span>' };

  if (st.s === 'bezig' && st.rang === 3) return { cls: '', chip: '<span class="chip info">Nr. 3 – wacht op andere poule</span>' };
  return { cls: 'uit', chip: '<span class="chip bad">Uit</span>' };
}

/* ---------- deelbare verslagen ---------- */
function verslagNamen(ids) { return (ids || []).filter(Boolean).map(spelerNaam); }
function verslagOpsomming(ids) {
  const namen = verslagNamen(ids);
  if (!namen.length) return '';
  if (namen.length === 1) return namen[0];
  if (namen.length === 2) return namen[0] + ' en ' + namen[1];
  return namen.slice(0, -1).join(', ') + ' en ' + namen[namen.length - 1];
}
function verslagVerloop(p, variant) {
  const games = p.schema.filter(g => g.w), totaal = p.schema.length, pauze = P.pauzeIndex(T, p);
  if (!games.length) return '';
  const winst = {}, reeks = {}, leiders = [];
  let koploper = '', wissels = 0, huidigeReeks = '', besteReeks = { id: '', n: 0 };
  games.forEach(g => {
    const id = g.w; winst[id] = (winst[id] || 0) + 1;
    if (huidigeReeks === id) reeks[id] = (reeks[id] || 1) + 1; else { huidigeReeks = id; reeks[id] = 1; }
    if (reeks[id] > besteReeks.n) besteReeks = { id, n: reeks[id] };
    const max = Math.max.apply(null, Object.keys(winst).map(x => winst[x]));
    const bovenaan = Object.keys(winst).filter(x => winst[x] === max);
    if (bovenaan.length === 1) {
      if (koploper && koploper !== bovenaan[0]) wissels++;
      koploper = bovenaan[0]; leiders.push(koploper);
    }
  });
  const voor = pauze ? games.filter(g => g.nr <= pauze) : [], na = pauze ? games.filter(g => g.nr > pauze) : [];
  const tel = (lijst, id) => lijst.filter(g => g.w === id).length;
  const rows = P.standPoule(T, p), eindLeider = rows[0] && rows[0].id;
  const startId = games[0] && games[0].w;
  let startReeks = 0; for (const g of games) { if (g.w !== startId) break; startReeks++; }
  const preWinners = {};
  voor.forEach(g => { preWinners[g.w] = (preWinners[g.w] || 0) + 1; });
  const preLeider = Object.keys(preWinners).sort((a, b) => preWinners[b] - preWinners[a])[0];
  const variantNum = (Number(variant) || 0) % 3;
  if (voor.length && na.length && startReeks >= Math.min(4, voor.length) && tel(na, startId) < na.length) {
    const teksten = [
      spelerNaam(startId) + ' schoot uit de startblokken met ' + startReeks + ' zeges op rij, maar liet na de pauze punten liggen. Daardoor bleef de spanning tot het einde voelbaar.',
      'Voor de pauze leek ' + spelerNaam(startId) + ' niet te stoppen: ' + startReeks + ' uit ' + startReeks + '. In de tweede helft werd het lastiger en kwam de concurrentie terug.',
      'Een vliegende start voor ' + spelerNaam(startId) + ' met ' + startReeks + ' overwinningen achter elkaar. Na de pauze werden de punten eerlijker verdeeld en werd het alsnog spannend.'
    ];
    return teksten[variantNum];
  }
  if (voor.length && na.length && preLeider && eindLeider && preLeider !== eindLeider && tel(na, eindLeider) > tel(voor, eindLeider)) {
    const teksten = [
      spelerNaam(preLeider) + ' stond bij de pauze nog bovenaan, maar ' + spelerNaam(eindLeider) + ' kwam in de tweede helft sterk terug en pakte uiteindelijk de leiding.',
      'Na de pauze kantelde de wedstrijd volledig: ' + spelerNaam(eindLeider) + ' maakte de achterstand goed en eindigde als koploper.',
      'De echte comeback kwam na de pauze. ' + spelerNaam(eindLeider) + ' schakelde een tandje bij en troefde de eerdere koploper af.'
    ];
    return teksten[variantNum];
  }
  if (besteReeks.n >= 4) return spelerNaam(besteReeks.id) + ' zette een indrukwekkende reeks neer met ' + besteReeks.n + ' overwinningen achter elkaar. 💪';
  if (wissels >= 2) return 'De koppositie ging meerdere keren van hand tot hand. Geen moment was duidelijk wie er met de winst vandoor zou gaan.';
  if (rows[0] && rows[1] && rows[0].punten - rows[1].punten <= 1) return 'De verschillen waren klein en iedere partij telde zwaar mee. De eindstand werd pas in de slotfase echt duidelijk.';
  const laatste = games[games.length - 1];
  if (laatste && laatste.w === eindLeider) return spelerNaam(eindLeider) + ' sloot de reguliere wedstrijden sterk af en won ook de laatste partij.';
  return 'Er werd fanatiek gestreden en de punten werden over de hele middag stevig bevochten.';
}
function verslagRanglijst(key, nr, voorlopig) {
  const p = P.zoekPoule(T, key, nr); if (!p) return '';
  const rows = P.standPoule(T, p), perId = {}; rows.forEach(r => { perId[r.id] = r; });
  const ids = !voorlopig && P.pouleAfgerond(T, p) ? P.eindvolgorde(T, p) : rows.map(r => r.id);
  const ppGroep = p.pp && p.pp.stappen && p.pp.stappen[0] ? p.pp.stappen[0].groep : [];

  function extra(id, pos) {

      const st = P.derdeStatus(T, key, Math.floor((nr - 1) / 2));
      if (st.status === 'playoff') return ' en nog kans op beste derde! 🤞';

    }

function bronnenPh(key, p) {

    if (id.startsWith('phx:')) {

      } else if (m && m[1] === vk) {
        if (m[2] === 'p') pool[Number(m[3])] = true;
        else derde[Number(m[3])] = true;
      }
    } else {
      for (let i = 0; i < Math.floor(vr.poules.length / 2); i++) {
        if (P.derdeStatus(T, vk, i).ph === id) derde[i] = true;
      }
    }
  });
  return { vk, pool, derde };
}

/* ---------- spelers ---------- */
function voegSpelerToe(naam, extra) {
  naam = String(naam || '').trim(); if (!naam) return null;
  const s = P.nieuweSpeler(naam); s.reserve = !wijzigbaar();
  if (extra) Object.assign(s, extra);
  T.spelers.push(s); return s;
}
function planOpnieuw() { if (wijzigbaar()) P.herplan(T); }
function parseVoorkeur(t) {
  t = String(t || '').trim().toLowerCase(); if (!t) return '';
  const a = P.dagNaam(T.instellingen.startdatum), b = P.dagNaam(P.plusDagen(T.instellingen.startdatum, 1));
  if (t === 'a' || t.slice(0, 2) === a.slice(0, 2)) return 'A';
  if (t === 'b' || t.slice(0, 2) === b.slice(0, 2)) return 'B';
  return '';
}
function parseDatum(t) {
  t = String(t || '').trim(); let m;
  if ((m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  if (t.match(/^\d{4}-\d{2}-\d{2}$/)) return t;
  return '';
}
async function plakNamen() {
  const res = await dialoog({ titel: 'Namen plakken', breed: true, ok: 'Toevoegen', html: '<p class="small">Eén speler per regel. Optioneel kun je met een tab of puntkomma ook een voorkeursdag (bijvoorbeeld “zaterdag”) en een datum waarop iemand niet kan (dd-mm-jjjj) meegeven, voor ronde 1.</p><textarea id="plakveld" placeholder="Aart\nBart;zondag\nCarlijn;;09-01-2027"></textarea>' +
    (wijzigbaar() ? '<label class="row" style="gap:8px;margin-top:10px;align-items:flex-start"><input type="checkbox" id="plakVolgorde" style="margin-top:3px"><span><b>Indelen in precies deze volgorde</b><br><span class="muted small">Geen loting: poule 1 krijgt de eerste namen, poule 2 de volgende, enzovoort. De hele spelerslijst wordt in lijstvolgorde ingedeeld.</span></span></label>' : ''),
    lees: ov => ({ tekst: $('#plakveld', ov).value, volgorde: !!($('#plakVolgorde', ov) && $('#plakVolgorde', ov).checked) }) });
  if (!res || res === true) return;
  const wilVolgorde = res.volgorde; const invoer = res.tekst;
  const key = T.plan.rondes.length ? T.plan.rondes[0].key : 'R1';
  let n = 0;
  String(invoer).split(/\r?\n/).forEach(regel => {
    const d = regel.split(/[\t;]/); const naam = (d[0] || '').trim(); if (!naam) return;
    const s = voegSpelerToe(naam); if (!s) return;
    const v = parseVoorkeur(d[1]); if (v) s.voorkeur[key] = v;
    const dt = parseDatum(d[2]); if (dt) s.nb[key] = dt;
    n++;
  });
  planOpnieuw();
  if (wilVolgorde && T.plan.rondes.length) {
    const k = T.plan.rondes[0].key, ir = indelenInVolgorde(k);
    if (ir.ok) { maakHerstelpunt('Na indelen in lijstvolgorde'); UI.lotingKey = k; UI.tab = 'loting'; commit(); toast(n + ' spelers toegevoegd en in volgorde ingedeeld'); return; }
    commit(); await melding('Indelen in volgorde lukt nog niet', '<p>' + ir.fouten.map(esc).join('<br>') + '</p><p class="small">De spelers zijn wel toegevoegd.</p>'); return;
  }
  commit(); toast(n + ' spelers toegevoegd');
}
function indelenInVolgorde(key) {
  const r = P.planRonde(T, key); if (!r) return { ok: false, fouten: ['Voeg eerst minstens 4 spelers toe.'] };
  const fouten = P.controleerLoting(T, key); if (fouten.length) return { ok: false, fouten };
  const ids = P.deelnemersVoor(T, key); let i = 0;
  const toew = r.sizes.map(s => { const rij = ids.slice(i, i + s); i += s; return rij; });
  const res = P.lootHandmatig(T, key, toew); if (res.ok) T.rondes[key].volgorde = true; return res;
}
async function uploadRondeVolgorde(key) {
  if (P.rondeGeloot(T,key)) return;
  const fouten=P.controleerLoting(T,key);
  if(fouten.length){await melding('Loting niet beschikbaar','<p>'+fouten.map(esc).join('<br>')+'</p>');return;}
  const file=await new Promise(resolve=>{const inp=document.createElement('input');inp.type='file';inp.accept='.txt,.csv,.xlsx';inp.onchange=()=>resolve(inp.files[0]||null);inp.click();});
  if(!file)return;
  let rows=[];
  try {
    if(/\.xlsx?$/i.test(file.name)) {
      if(!window.XLSX){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=()=>reject(Error('Excel-leesmodule kon niet worden geladen. Gebruik CSV of TXT.'));document.head.appendChild(sc);});}
      const book=XLSX.read(await file.arrayBuffer(),{type:'array'});
      rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''}).map(r=>String(r.find(x=>String(x).trim())||'').trim());
    } else {
      const text=(await file.text()).replace(/^\uFEFF/,'');
      rows=text.split(/\r?\n/).map(line=>{const v=line.trim();if(!v)return '';const sep=v.includes(';')?';':(v.includes('\t')?'\t':',');return v.split(sep)[0].replace(/^"|"$/g,'').trim();});
    }
  }catch(e){await melding('Bestand niet gelezen','<p>'+esc(e.message||e)+'</p>');return;}
  rows=rows.filter(Boolean);
  if(rows.length && /^(naam|namen|speler|spelers|deelnemer|deelnemers|team|koppel)$/i.test(rows[0]))rows.shift();
  const ids=P.deelnemersVoor(T,key), normal=n=>String(n).normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('nl');
  const map=new Map();ids.forEach(id=>{const k=normal(spelerNaam(id));map.set(k,(map.get(k)||[]).concat(id));});
  const gebruikt=new Set(),toew=[],issues=[];
  rows.forEach((name,i)=>{const found=map.get(normal(name))||[];if(found.length!==1){issues.push('Regel '+(i+1)+': '+name+(found.length?' (naam niet uniek)':' (niet gevonden bij deelnemers van deze ronde)'));return;}if(gebruikt.has(found[0])){issues.push('Regel '+(i+1)+': '+name+' staat dubbel');return;}gebruikt.add(found[0]);toew.push(found[0]);});
  ids.filter(id=>!gebruikt.has(id)).forEach(id=>issues.push('Ontbreekt: '+spelerNaam(id)));
  if(rows.length!==ids.length)issues.unshift('Bestand bevat '+rows.length+' namen, maar deze ronde heeft '+ids.length+' deelnemers.');
  if(issues.length){await melding('Controle upload – niet ingedeeld','<p>Corrigeer het bestand en upload opnieuw. Er is niets gewijzigd.</p><div style="max-height:50vh;overflow:auto"><ul>'+issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>');return;}
  const r=P.planRonde(T,key);let at=0;
  UI.manual={key,toewijzing:r.sizes.map(size=>{const x=toew.slice(at,at+size);at+=size;return x;})};
  UI.lotingKey=key;
  render();
  toast('Upload gecontroleerd. Controleer de poules en klik Bevestig loting.');
}

async function voorbeeldSpelers() {
  if (!wijzigbaar()) { toast('Na de loting kunnen geen voorbeeldspelers meer worden geladen.', true); return; }
  const res = await dialoog({ titel: 'Voorbeeldspelers laden', ok: 'Laden', html: '<p class="small">Handig om de app te proberen. Bestaande spelers worden vervangen.</p><label class="f"><span>Aantal spelers</span><input type="number" id="vbAantal" min="4" max="120" value="50" style="width:120px"></label>', lees: ov => parseInt($('#vbAantal', ov).value, 10) });

  planOpnieuw(); commit(); toast(n + ' voorbeeldspelers geladen');
}

function startAnimatie(key, stappen) {

  if (v <= 0 || !stappen || !stappen.length) { UI.anim = null; return; }
  UI.anim = { key, stappen, i: 0 };
  UI.timer = setInterval(() => {
    if (!UI.anim) { clearInterval(UI.timer); return; }
    UI.anim.i++;
    if (UI.anim.i > UI.anim.stappen.length) { stopAnimatie(); render(); return; }
    renderLotingKaarten();
  }, Math.max(30, v * 1000));
}
function stopAnimatie() { if (UI.timer) clearInterval(UI.timer); UI.timer = null; UI.anim = null; }
async function voerLotingUit(key) {
  let res = P.loot(T, key);
  if (!res.ok && res.capaciteit) {
    const ga = await bevestig('De voorkeuren zijn niet allemaal haalbaar:<br><b>' + res.capaciteit.meldingen.map(esc).join('<br>') + '</b><br><br>De loting houdt zoveel mogelijk rekening met voorkeuren en deelt de overige spelers willekeurig in. Doorgaan?', { titel: 'Voorkeuren niet haalbaar', ja: 'Toch loten' });
    if (!ga) return; res = P.loot(T, key, { negeerCapaciteit: true });
  }
  if (!res.ok) { await melding('De loting kan niet starten', '<p>' + (res.fouten || []).map(esc).join('<br>') + '</p>'); return; }
  maakHerstelpunt('Na loting ' + rondeNaam(key));
  UI.lotingKey = key; UI.modus = null; UI.sel = null;
  startAnimatie(key, res.stappen);
  commit();
  if (res.opmerkingen && res.opmerkingen.length) toast(res.opmerkingen.length + ' voorkeur(en) niet gevolgd – zie “Let op”.');
}

/* ---------- uitslagen ---------- */
async function controleerVolgendeRondeGeloot(key) {
  const vk = P.volgendeKey(T, key);
  if (!vk || !P.rondeGeloot(T, vk)) return true;
  if (UI.bevestigd[key]) return true;
  const ja = await bevestig('De volgende ronde (' + esc(rondeNaam(vk)) + ') is al geloot. Een wijziging in deze ronde werkt <b>niet</b> door in die loting. Toch wijzigen?', { titel: 'Let op', ja: 'Toch wijzigen' });
  if (ja) UI.bevestigd[key] = true; return ja;
}
function meldNaUitslag(key, nr, voor) {
  const p = P.zoekPoule(T, key, nr), na = { klaar: P.pouleAfgerond(T, p), reg: P.reguliereKlaar(p), po: !!(p.pp && !p.pp.voltooid) };
  if (!voor.reg && na.reg) {
    if (na.po) { toast('Alle wedstrijden gespeeld – gelijke stand, play-off nodig!'); UI.scrollNaar = 'ppblok'; }
    else toast('Alle wedstrijden zijn ingevoerd.');
  } else if (voor.po && !na.po && na.klaar) toast('Play-off beslist.');
  const vk = P.volgendeKey(T, key);
  if (!voor.rondeKlaar && P.rondeAfgerond(T, key)) { maakHerstelpunt(rondeNaam(key) + ' afgerond'); toast(rondeNaam(key) + ' is afgerond' + (vk ? ' – klaar voor de loting van ' + rondeNaam(vk).toLowerCase() : '')); }
}
function momentopname(key, nr) { const p = P.zoekPoule(T, key, nr); return { klaar: P.pouleAfgerond(T, p), reg: P.reguliereKlaar(p), po: !!(p.pp && !p.pp.voltooid), rondeKlaar: P.rondeAfgerond(T, key) }; }
async function actWin(b) {
  const key = b.dataset.key, nr = +b.dataset.nr, gnr = +b.dataset.g, w = b.dataset.w;
  const p = P.zoekPoule(T, key, nr);
  if (p && playOffBlokkeertRegulier(key, p)) {
    await melding('Reguliere wedstrijd nog geblokkeerd', '<p>De play-off moet eerst worden beslist voordat je uitslagen van deze speeldag kunt invoeren.</p><p>Voer eerst de play-offuitslagen in. Zodra de winnaar bekend is, worden de reguliere wedstrijden vrijgegeven.</p>');
    return;
  }
  if (await volgordeGeblokkeerd()) return;
  const g = p.schema.find(x => x.nr === gnr);
  if (!(await controleerVolgendeRondeGeloot(key))) return;
  const voor = momentopname(key, nr);
  const res = P.zetUitslag(T, key, nr, gnr, g.w === w ? null : w);
  if (!res.ok) { toast(res.tekst, true); return; }
  meldNaUitslag(key, nr, voor); commit();
}
async function actPpWin(b) {
  if (await volgordeGeblokkeerd()) return;
  const key = b.dataset.key, nr = +b.dataset.nr, si = +b.dataset.stap, gnr = +b.dataset.g, w = b.dataset.w;
  const p = P.zoekPoule(T, key, nr), g = p.pp.stappen[si].games.find(x => x.nr === gnr);
  if (P.pouleAfgerond(T, p) && !(await controleerVolgendeRondeGeloot(key))) return;
  const voor = momentopname(key, nr);
  P.zetPpUitslag(T, key, nr, si, gnr, g.w === w ? null : w);
  meldNaUitslag(key, nr, voor); commit();
}
async function actDerdeWin(b) {
  // Gebruik dezelfde bron als formatkeuze en startteamwissel.
  const key = b.dataset.key, i = +b.dataset.i, gnr = +b.dataset.g, w = b.dataset.w;
  const po = T.derden && T.derden[key] && T.derden[key][i];
  const g = po && po.games && po.games.find(x => x.nr === gnr);
  if (!g) { toast('Play-offwedstrijd niet gevonden.', true); return; }
  // De play-off wordt op de volgende speeldag gespeeld. De normale
  // volgordecontrole op ronde 1 mag de uitslag daarom niet blokkeren.
  const was = po.winnaar;
  const res = P.zetDerdeUitslag(T, key, i, gnr, g.w === w ? null : w);
  if (!res.ok) { toast(res.tekst || 'Uitslag niet opgeslagen.', true); return; }
  commit();
  if (!was && res.winnaar) toast(spelerNaam(res.winnaar) + ' wint de play-off en gaat door.');
}

async function herstelVorige(key, nr) {
  if (await volgordeGeblokkeerd()) return;
  const huidigePoule = P.zoekPoule(T,key,nr);
  const heeftEigenUitslag = !!(huidigePoule && (P.laatsteGame(huidigePoule) || (huidigePoule.pp && huidigePoule.pp.stappen.some(st => st.games.some(g => g.w)))));
  if (!heeftEigenUitslag) {
    const vorige = P.vorigeKey(T,key);
    const playoffs = vorige ? (T.derden?.[vorige] || []) : [];
    const i = Object.keys(playoffs).map(Number).find(i => { const po = playoffs[i]; return po && Array.isArray(po.games) && po.games.some(g => g.w); }) ?? -1;
    if (i >= 0) {
      if (!(await bevestig('De laatste play-offwedstrijd uit de vorige ronde herstellen? De eventuele winnaar wordt weer een open plaats. Reeds gespeelde wedstrijden in de volgende ronde worden beschermd.', {titel:'Vorige play-off herstellen?',ja:'Herstellen'}))) return;
      maakHerstelpunt('Voor herstel vorige play-offwedstrijd');
      const result = P.herstelDerdeVorige(T,vorige,i);
      if (!result.ok) {toast(result.tekst || 'Herstel niet mogelijk',true);return;}
      commit();toast('Play-offwedstrijd '+result.nr+' opnieuw geopend.');return;
    }
  }
  const r = P.herstelVorige(T, key, nr);
  if (r && (r.vergrendeld || r.fout)) { toast(r.fout || 'Deze speeldag is vergrendeld.', true); return; }
  if (!r) { toast('Er is nog geen wedstrijd om te herstellen.', true); return; }
  toast(r.soort === 'pp' ? 'Play-offwedstrijd ' + r.nr + ' is opnieuw geopend.' : 'Wedstrijd ' + r.nr + ' is opnieuw geopend.'); commit();
}

/* ---------- wisselen en vervangen ---------- */
async function kiesSpeler(id) {
  const key = lotingKey();
  if (UI.modus === 'wissel') {
    if (!UI.sel) { UI.sel = id; render(); return; }
    if (UI.sel === id) { UI.sel = null; render(); return; }
    const res = P.wissel(T, key, UI.sel, id);
    if (!res.ok) { toast(res.tekst, true); UI.sel = null; render(); return; }
    UI.sel = null; UI.modus = null; toast('Gewisseld'); commit();
  } else if (UI.modus === 'vervang') {
    if (!P.positieVan(T, key, id)) { toast('Kies een speler uit een poule.', true); return; }
    const p = P.positieVan(T, key, id).poule;
    if (P.heeftScores(p)) { toast('Vervangen kan niet meer: in deze poule is al een score ingevoerd.', true); return; }
    const k = P.vervangKandidaten(T, key, id);
    const voorstel = k.voorstel;
    const zonderVoorstel = lijst => lijst.filter(x => !voorstel || x.id !== voorstel.id);
    const optie = (lbl, lijst, f) => lijst.length ? '<optgroup label="' + lbl + '">' + lijst.map(x => '<option value="' + esc(x.id) + '">' + esc(spelerNaam(x.id)) + (f ? ' ' + f(x) : '') + '</option>').join('') + '</optgroup>' : '';
    const voorstelOptie = voorstel ? '<optgroup label="Voorstel uit oorspronkelijk weekend"><option value="' + esc(voorstel.id) + '" selected>' + esc(spelerNaam(voorstel.id)) + ' (' + voorstel.punten + ' pt, poule ' + voorstel.poule + ')</option></optgroup>' : '';
    const uitleg = voorstel ? '<div class="note good small"><b>Voorstel:</b> ' + esc(spelerNaam(voorstel.id)) + ' is de eerstvolgende best geklasseerde, nog beschikbare deelnemer uit hetzelfde oorspronkelijke weekend. Je kunt hieronder ook iemand anders kiezen.</div>' : '';
    const html = '<p>Wie neemt de plek in van <b>' + esc(spelerNaam(id)) + '</b>?</p>' + uitleg + '<label class="f"><span>Vervanger</span><select id="vervSel">' +
      voorstelOptie + optie('Andere deelnemers uit hetzelfde oorspronkelijke weekend', zonderVoorstel(k.weekend), x => '(' + x.punten + ' pt, poule ' + x.poule + ')') +
      optie('Beste nummers 3 van de vorige ronde', zonderVoorstel(k.derde), x => '(' + x.punten + ' pt, poule ' + x.poule + ')') + optie('Volgende uit de oorspronkelijke poule', zonderVoorstel(k.bron), x => '(poule ' + x.poule + ')') +
      (P.rondeIndex(T, key) === 0 ? optie('Reserves', k.overig.filter(x => x.reserve), null) : '') + optie('Overige spelers', k.overig.filter(x => !x.reserve && (!voorstel || x.id !== voorstel.id)), null) + '</select></label>';
    const res = await dialoog({ titel: 'Speler vervangen', html, ok: 'Vervangen', lees: ov => $('#vervSel', ov).value });
    if (!res || res === true) { return; }
    const w = P.wissel(T, key, id, res);
    if (!w.ok) { toast(w.tekst, true); return; }
    UI.modus = null; UI.sel = null; toast(spelerNaam(id) + ' is vervangen door ' + spelerNaam(res)); commit();
  }
}

r in de poulekaart. Kies de reserve in de keuzelijst en bevestig Vervangen. Dit kan alleen zolang in die poule nog geen uitslag is ingevoerd."], ["Hoe wissel ik spelers uit twee poules?", "Ga naar Loting en kies de juiste ronde. Klik Wissel spelers, selecteer een speler in de eerste poule en daarna een speler in de tweede poule. De wedstrijdschema’s worden opnieuw opgebouwd. Dit kan alleen als in beide poules nog geen score is ingevoerd."], ["Hoe laat ik een uitgeschakelde speler uit ronde 1 opnieuw instromen in ronde 2?", "Open Loting → Speler vervangen en selecteer de uitvaller. De app toont een voorstel uit hetzelfde oorspronkelijke weekend en alternatieven, waaronder beschikbare nummers 3 of deelnemers uit de oorspronkelijke poule. Vervangen kan niet als de betreffende poule al scores heeft."], ["Kan ik een naam na de loting corrigeren?", "Ja. Pas de naam aan op het tabblad Spelers. De bestaande deelnemer-ID blijft behouden."], ["Waarom kan ik een speler niet wisselen?", "Wisselen wordt geblokkeerd zodra een betrokken poule een score heeft, of als de deelnemer nog een onbekende play-offplaats is."]]}, {"title": "Loting en indeling", "items": [["Hoe doe ik een automatische loting?", "Open Loting, selecteer de ronde en klik Start de loting. De app houdt zo veel mogelijk rekening met dagvoorkeuren en verhinderdatums."], ["Hoe loot ik handmatig?", "Kies Loting → Handmatig loten. Selecteer per positie een speler. Met Rest willekeurig aanvullen kun je open plekken automatisch vullen. Klik daarna Bevestig loting."], ["Hoe deel ik in lijstvolgorde in?", "Kies Loting → Indelen in lijstvolgorde. Poule 1 krijgt de eerste namen uit de deelnemerslijst, poule 2 de volgende, enzovoort. Ook bij Namen plakken kun je deze optie kiezen."], ["Kan ik opnieuw loten?", "Ja, zolang er in de ronde nog geen uitslagen zijn. Kies Loting → Opnieuw loten en bevestig. Let op: ook al gelote latere rondes worden dan teruggezet."], ["Wat als dagvoorkeuren niet haalbaar zijn?", "De app meldt welke dag te veel voorkeuren heeft. Je kunt voorkeuren aanpassen of via Toch loten doorgaan; niet alle voorkeuren worden dan gevolgd."], ["Kan ik een volgende ronde loten voordat alle play-offs klaar zijn?", "Ja, zodra alle reguliere poulewedstrijden van de vorige ronde zijn ingevuld. Openstaande play-offplaatsen worden als tijdelijke A / B-plaats ingeloot. De winnaar neemt die plek later automatisch over."], ["Hoe druk ik de loting af?", "Open de gelote ronde op Loting en klik Afdrukken. Je kunt in de browser afdrukken of opslaan als PDF."]]}, {"title": "Speeldagen en uitslagen", "items": [["Hoe voer ik een uitslag in?", "Open Speeldagen en kies de poule. Tik op de naam van de winnaar. De stand wordt direct bijgewerkt. De speler links breekt."], ["Hoe wis ik een foutieve uitslag?", "Tik bij een nog open speeldag opnieuw op de geselecteerde winnaar om die uitslag te wissen. Of gebruik Herstel vorige wedstrijd. Op een toetsenbord werken ook 1 / pijl links, 2 / pijl rechts en Backspace."], ["Waarom kan ik een afgeronde dag niet wijzigen?", "Een afgeronde speeldag wordt automatisch vergrendeld. Klik Ontgrendelen om een correctie mogelijk te maken. Vergrendel daarna opnieuw."], ["Waarom kan ik een latere speeldag niet invoeren?", "Standaard moeten eerdere speeldagen eerst afgerond zijn. Bij Instellingen → Toernooi kun je Speeldagen op volgorde afwerken uitschakelen, bijvoorbeeld als een dag uitvalt."], ["Kan ik een speeldag verplaatsen?", "Ga naar Planning en wijzig de datum van de betreffende speeldag. Zodra in die poule uitslagen zijn ingevoerd, is het datumveld vergrendeld."], ["Hoe wijzig ik de pauze?", "Ga naar Instellingen → Toernooi → Pauze in de speeldag. Kies halverwege, geen pauze of na een bepaald wedstrijdnummer."], ["Hoe toon ik een scorebord op tv?", "Open een speeldag en klik Scorebord in eigen venster. Dat venster kan op een tweede scherm of tv worden getoond."], ["Hoe maak ik een verslag van een speeldag?", "Na de reguliere wedstrijden verschijnt het automatisch samengestelde verslag onder de speeldag. Kies Andere invalshoek voor een andere variant, pas tekst aan en klik Kopieer verslag."]]}, {"title": "Standen, play-offs en doorgaan", "items": [["Hoe worden punten geteld?", "Een gewonnen wedstrijd levert één punt op. Er is geen remise. Iedereen speelt in de reguliere poule twee keer tegen iedere tegenstander; de break wisselt bij de return."], ["Wie gaat door naar de volgende ronde?", "Normaal de beste twee van elke poule. Afhankelijk van de ingestelde opzet gaat ook de beste nummer 3 per weekend door."], ["Wat gebeurt er bij een gelijke stand?", "Als een gelijke stand de doorgangsgrens raakt, maakt de app een play-off aan. Bij twee spelers kun je Best of 1, 3 of 5 kiezen; bij meer spelers een competitievariant. Bij opnieuw gelijk volgt zo nodig een extra play-off."], ["Hoe wordt de beste nummer 3 bepaald?", "De nummers 3 van twee poules in hetzelfde weekend worden op winstpercentage vergeleken. Bij gelijk volgt een onderlinge play-off, standaard Best of 3."], ["Hoe bepaal ik wie breekt in een play-off?", "Gebruik de knop 🎲 Loot wie breekt in het play-offblok voordat uitslagen zijn ingevoerd. De app verdeelt de breaks zo eerlijk mogelijk."], ["Wat als een speler niet kan deelnemen aan een play-off?", "Gebruik Winst wegens verhindering in de play-off. Daarmee krijgt de tegenstander een walk-over. Een foutieve walk-over kun je op Loting bij Geregistreerde walk-overs ongedaan maken."], ["Hoe wijzig ik een play-offvorm?", "Selecteer in het play-offblok bij Formaat de gewenste variant, vóórdat er uitslagen zijn ingevoerd. Als er al scores staan, moet de play-off eerst opnieuw worden opgezet."], ["Hoe wordt de kampioen bepaald?", "In de finale bepaalt de eindvolgorde de kampioen en de plaatsen 2 en 3. Gelijke standen die deze plaatsen raken, worden via play-offs beslist."]]}, {"title": "Break & Run en statistieken", "items": [["Hoe zet ik Break & Run aan?", "Ga naar Instellingen → Toernooi en vink Break & Run bijhouden aan."], ["Hoe registreer ik een Break & Run?", "Open de speeldag en klap 🎱 Break & Run registreren uit. Selecteer de wedstrijd en gebruik + of − bij de juiste deelnemer. De ranking wordt toernooibreed bijgehouden."], ["Hoe corrigeer ik een Break & Run?", "Selecteer dezelfde wedstrijd in het uitklapblok en gebruik de minknop om de registratie te verminderen of te verwijderen."], ["Waar zien toeschouwers de Break & Runs?", "Als de optie is ingeschakeld, verschijnt een samenvatting als voetnoot bij de speeldag. In het beheerdersblok staat de individuele ranking."]]}, {"title": "Toeschouwers en online", "items": [["Hoe maak ik het toernooi openbaar?", "Ga naar ☰ → Instellingen → Opslag en back-up → Online versie. Meld je aan en kies bij Toegang van dit toernooi Openbaar – iedereen mag bekijken."], ["Hoe deel ik de toeschouwerslink?", "Bij Online versie verschijnt voor een openbaar toernooi de publieke URL. Gebruik Korte link kopiëren en deel die via WhatsApp of een QR-code."], ["Moeten toeschouwers inloggen?", "Nee. Een openbaar toernooi is via de publieke kijklink zonder beheerdersaccount te bekijken."], ["Hoe ververs ik de stand voor toeschouwers?", "De publieke versie synchroniseert online en heeft daarnaast een knop ↻ Vernieuwen. Controleer bij problemen of het juiste toernooi openbaar staat en online is opgeslagen."], ["Kunnen twee beheerders tegelijk werken?", "Met online synchronisatie kunnen bevoegde beheerders hetzelfde toernooi openen. Voorkom dat twee beheerders tegelijkertijd dezelfde uitslag aanpassen."]]}, {"title": "Opslag, herstel en problemen", "items": [["Waar wordt de voortgang bewaard?", "De app bewaart automatisch in de huidige browser en kan online synchroniseren. Maak daarnaast geregeld een back-up via Bewaar als bestand."], ["Hoe maak ik een back-up?", "Ga naar Overzicht → Voortgang veilig stellen → Bewaar als bestand, of naar Instellingen → Opslag en back-up."], ["Hoe herstel ik een eerdere versie?", "Ga naar Instellingen → Opslag en back-up → Herstelpunten. Kies het gewenste herstelpunt en klik Terugzetten. Controleer vooraf wat je daarmee overschrijft."], ["Kan ik automatisch in een lokaal bestand bewaren?", "Ja, op ondersteunde versies van Chrome en Edge via Instellingen → Opslag en back-up → Koppel een bestand. Na heropenen kan opnieuw toestemming nodig zijn."], ["Hoe laad ik een opgeslagen bestand?", "Gebruik Open bestand… bij Overzicht of Opslag en back-up en selecteer het eerder opgeslagen JSON-bestand."], ["Wat als de verkeerde loting is uitgevoerd?", "Als er nog geen uitslagen zijn, gebruik Opnieuw loten. Zijn er al uitslagen, controleer dan eerst de beschikbare herstelpunten; voorkom verlies van gespeelde resultaten."], ["Waarom verschijnt een uitslag niet online?", "Controleer de online aanmelding, Automatisch online synchroniseren en de actieve toernooinaam. Gebruik zo nodig Nu online bewaren en ververs de publieke pagina."], ["Hoe test ik het toernooi zonder echte uitslagen?", "Schakel bij Instellingen → Toernooi de Testmodus in. Bij speeldagen verschijnen testhulpen voor willekeurige uitslagen en gelijke standen. Gebruik dit niet tijdens een echt toernooi."], ["Waar vind ik recente wijzigingen in de app?", "Open ☰ → Changelog."]]}];

/* ---------- scorebord in eigen venster (tweede scherm) ---------- */
function sbVensterOpen() { return !!(UI.sbWin && !UI.sbWin.closed); }
function openScorebordVenster() {
  let w = null;
  try { w = window.open('', 'pooltoernooi_scorebord', 'popup=yes,width=1280,height=720'); } catch (e) { }
  if (!w) { toast('Het venster werd geblokkeerd. Sta pop-ups toe voor deze pagina en probeer opnieuw.', true); return; }
  // Bouw het scorebordvenster met DOM-elementen in plaats van HTML-broncode
  // in een scriptstring. Dit voorkomt dat HTML-afsluitcodes de hoofdpagina verstoren.
  const doc = w.document;
  doc.title = 'Scorebord';
  doc.documentElement.lang = 'nl';
  const meta = doc.createElement('meta');
  meta.name = 'viewport';
  meta.content = 'width=device-width, initial-scale=1';
  doc.head.appendChild(meta);
  const style = doc.createElement('style');
  style.textContent = Array.from(document.querySelectorAll('style')).map(el => el.textContent).join('\n') +
    '\nbody{margin:0}.scorebord.venster{position:static;min-height:100vh}';
  doc.head.appendChild(style);
  doc.body.replaceChildren();
  const sb = doc.createElement('div');
  sb.id = 'sb';
  doc.body.appendChild(sb);
  UI.sbWin = w;
  ververscScorebordVenster();
  toast('Scorebord geopend. Sleep het venster naar je tweede scherm en druk op “Volledig scherm”.');
}
function ververscScorebordVenster() {
  if (!sbVensterOpen()) { UI.sbWin = null; return; }
  try {
    const w = UI.sbWin, root = document.documentElement, wr = w.document.documentElement;
    wr.setAttribute('style', root.getAttribute('style') || ''); wr.setAttribute('data-mode', root.getAttribute('data-mode') || 'light');
    const el = w.document.getElementById('sb'); if (!el) return;
    const html = scorebordHtml(true); if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
    const loc = locatieVoorWeergave(); w.document.title = 'Scorebord – ' + (loc.naam || '');
  } catch (e) { UI.sbWin = null; }
}

<!--
  ONLINE-BASIS
  Deze adapter is bewust los gehouden van de bestaande toernooi-engine.
  De loting-, score-, stand- en play-offlogica blijft daardoor gelijk.

  Na het aanmaken van het Firebase-project worden alleen de waarden hieronder
  ingevuld. Zonder configuratie blijft de app volledig lokaal werken.

<script>
window.POOL_ONLINE_CONFIG = window.POOL_ONLINE_CONFIG || {

  firebase: {

<script type="module">
/*
 * Firebase-adapter voor de online versie.
 * De adapter schrijft één volledig gevalideerd toernooi-object per document.
 * Daardoor blijven JSON-back-ups en de bestaande lokale opslag bruikbaar.
 */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp, collection, getDocs
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

const cfg = window.POOL_ONLINE_CONFIG || {};
const firebaseConfig = cfg.firebase || {};
const required = ['apiKey', 'authDomain', 'projectId', 'appId'];
const configured = cfg.enabled === true && required.every(k => String(firebaseConfig[k] || '').trim());

let app = null, auth = null, db = null, unsubscribe = null, publicUnsubscribe = null;
let currentUser = null;
let readyResolve;
const ready = new Promise(resolve => { readyResolve = resolve; });

const state = {
  configured,
  status: configured ? 'initialiseren' : 'lokaal',
  user: null,
  error: '',
  tournaments: [],
  remoteId: null,
  lastRemoteWrite: null,
  lastRemoteRead: null
};

function notify() {
  window.dispatchEvent(new CustomEvent('pool-online-status', { detail: { ...state } }));
}

function fail(message, error) {
  state.status = 'fout';
  state.error = message + (error && error.message ? ': ' + error.message : '');
  notify();
  throw new Error(state.error);
}

async function init() {
  if (!configured) {
    state.status = 'lokaal';
    notify();
    readyResolve(api);
    return api;
  }
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, user => {
      currentUser = user || null;
      state.user = user ? { uid: user.uid, email: user.email || '' } : null;
      state.status = user ? 'online' : 'niet-aangemeld';
      state.error = '';
      if (user) listTournaments().catch(() => {});
      notify();
    });
    state.status = 'niet-aangemeld';
    notify();
    readyResolve(api);
    return api;
  } catch (e) {
    state.status = 'fout';
    state.error = 'Firebase kon niet worden gestart: ' + (e.message || e);
    notify();
    readyResolve(api);
    return api;
  }
}

async function login(email, password) {
  await ready;
  if (!configured || !auth) return fail('Online configuratie ontbreekt');
  try {
    await signInWithEmailAndPassword(auth, String(email || '').trim(), password || '');
    return state.user;
  } catch (e) { return fail('Aanmelden mislukt', e); }
}

async function logout() {
  await ready;
  if (auth) await signOut(auth);
}

function assertOnline() {
  if (!configured || !db) throw new Error('Online configuratie ontbreekt');
  if (!currentUser) throw new Error('Meld eerst aan');
}

async function saveTournament(T, extra) {
  await ready;
  try {
    assertOnline();
    const id = String(T.id || '').trim();
    if (!id) throw new Error('Toernooi heeft geen id');
    const payload = {
      id,
      naam: T.naam || 'Pooltoernooi',
      locatieId: T.locatieId || null,
      gewijzigd: T.gewijzigd || new Date().toISOString(),
      status: extra && extra.status || 'actief',
      toegang: extra && extra.toegang || 'besloten',
      access: extra && extra.toegang || 'besloten',
      eigenaarUid: currentUser.uid,
      state: T,
      updatedAt: serverTimestamp()
    };
    await setDoc(doc(db, 'tournaments', id), payload, { merge: true });
    state.remoteId = id;
    state.lastRemoteWrite = Date.now();
    state.status = 'online';
    state.error = '';
    notify();
    return true;
  } catch (e) { return fail('Online bewaren mislukt', e); }
}

async function saveLocation(location, extra) {
  await ready;
  try {
    assertOnline();
    const id = String(location && location.id || '').trim();
    if (!id) throw new Error('Locatie heeft geen id');
    await setDoc(doc(db, 'locations', id), {
      id,
      naam: location.naam || 'Locatie',
      toegang: extra && extra.toegang || 'besloten',
      actief: extra && extra.actief !== undefined ? !!extra.actief : true,
      eigenaarUid: currentUser.uid,
      updatedAt: serverTimestamp()
    }, { merge: true });
    return true;
  } catch (e) { return fail('Locatie online bewaren mislukt', e); }
}

async function loadLocation(id) {
  await ready;
  try {
    if (!configured || !db) throw new Error('Online configuratie ontbreekt');
    const snap = await getDoc(doc(db, 'locations', String(id)));
    return snap.exists() ? snap.data() : null;
  } catch (e) { return fail('Locatie online laden mislukt', e); }
}

async function loadTournament(id, options) {
  await ready;
  try {
    const publicRead = options && options.public === true;
    if (!publicRead) assertOnline();
    if (!configured || !db) throw new Error('Online configuratie ontbreekt');
    const snap = await getDoc(doc(db, 'tournaments', String(id)));
    if (!snap.exists()) return null;
    if (publicRead && snap.data().toegang !== 'openbaar') return null;
    state.remoteId = String(id);
    state.lastRemoteRead = Date.now();
    notify();
    return snap.data().state || null;
  } catch (e) { return fail('Online laden mislukt', e); }
}

async function listTournaments() {
  await ready;
  try {
    assertOnline();
    const snap = await getDocs(collection(db, 'tournaments'));
    const lijst = [];
    snap.forEach(item => {
      const d = item.data() || {};
      const t = d.state || {};
      const locaties = Array.isArray(t.locaties) ? t.locaties : [];
      const loc = locaties.find(x => x && x.id === t.locatieId) || locaties[0] || {};
      lijst.push({
        id: String(d.id || item.id),
        naam: String(d.naam || t.naam || 'Pooltoernooi'),
        locatieNaam: String(loc.naam || ''),
        gewijzigd: d.gewijzigd || t.gewijzigd || ''
      });
    });
    lijst.sort((a, b) => String(b.gewijzigd).localeCompare(String(a.gewijzigd)) || a.naam.localeCompare(b.naam, 'nl'));
    state.tournaments = lijst;
    state.error = '';
    notify();
    return lijst;
  } catch (e) { return fail('Online toernooien laden mislukt', e); }
}

function subscribeTournament(id, onRemote) {
  if (!db || !currentUser) return () => {};
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(doc(db, 'tournaments', String(id)), snap => {
    if (!snap.exists()) return;
    state.remoteId = String(id);
    state.lastRemoteRead = Date.now();
    notify();
    if (typeof onRemote === 'function' && snap.data().state) onRemote(snap.data().state);
  }, e => {
    state.status = 'fout'; state.error = 'Online synchroniseren mislukt: ' + (e.message || e); notify();
  });
  return () => { if (unsubscribe) unsubscribe(); unsubscribe = null; };
}

// Publieke kijkers mogen realtime meeluisteren zonder in te loggen.
// Als Firestore luisteren door browser- of regelinstellingen niet lukt,
// blijft de periodieke controle in de hoofdapp als vangnet actief.
function subscribePublicTournament(id, onRemote) {
  if (!db) return () => {};
  if (publicUnsubscribe) publicUnsubscribe();
  publicUnsubscribe = onSnapshot(doc(db, 'tournaments', String(id)), snap => {
    if (!snap.exists()) return;
    const data = snap.data() || {};
    if (data.toegang !== 'openbaar' || !data.state) return;
    state.remoteId = String(id);
    state.lastRemoteRead = Date.now();
    if (typeof onRemote === 'function') onRemote(data.state);
  }, () => {
    // Stil falen: de periodieke publieke refresh blijft beschikbaar.
  });
  return () => {
    if (publicUnsubscribe) publicUnsubscribe();
    publicUnsubscribe = null;
  };
}

const api = {
  state,
  ready,
  init,
  login,
  logout,
  saveTournament,
  saveLocation,
  loadLocation,
  loadTournament,
  listTournaments,
  subscribeTournament,
  subscribePublicTournament,
  get user() { return currentUser; }
};
window.POOL_ONLINE = api;
window.dispatchEvent(new CustomEvent('pool-online-ready', { detail: api }));
init();
</script>
